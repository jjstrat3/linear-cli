[package]
name = "linear-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A secure, fast Linear CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/jjstrat3/linear-cli"

[[bin]]
name = "lin"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
getrandom = "0.4"
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
ureq = { version = "3", features = ["json", "platform-verifier"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
